<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-page">
      <nav class="navbar">
        <div class="kino-select">KinoSelect</div>
        <ul class="nav-links">
          <li><a href="index.html">Main Page</a></li>
          <li><a href="#films-of-the-day">Films of the day</a></li>
          <li><a href="pages/contact.html">Contact</a></li>
          <li><a href="#">Log In</a></li>
          <li><a href="#">Sign up</a></li>
        </ul>
      </nav>
      <div class="hero-content">
        <h1>CHOOSE YOUR FILM</h1>
        <p>Hungry for some films? Click on the button.</p>
        <div class="btn">Search for Films</div>
      </div>
    </header>
    <section id="films-of-the-day" class="films-of-the-day-section">
      <h2>Films of the Day</h2>
      <div class="film-grid">
        <div class="film-card">
          <img src="images/minecraftFilm.jpg" alt="Film 1" />
          <h3>A Minecraft Movie</h3>
          <button class="buy-button">Buy Ticket</button>
        </div>
        <div class="film-card">
          <img src="images/StarWarsEP3.jpg" alt="Film 2" />
          <h3>Star Wars Episode III - Revenge Of the Sith</h3>
          <button class="buy-button">Buy Ticket</button>
        </div>
        <div class="film-card">
          <img src="images/UntilDawnFilm.jpeg" alt="Film 3" />
          <h3>Until Dawn</h3>
          <button class="buy-button">Buy Ticket</button>
        </div>
        <div class="film-card">
          <img src="images/Mickey17Film.png" alt="Film 4" />
          <h3>Mickey 17</h3>
          <button class="buy-button">Buy Ticket</button>
        </div>
      </div>
    </section>
  </body>
</html>
